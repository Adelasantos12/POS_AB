<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Autenticar Perfil - Adelé</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body { background-color: #f8f9fa; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; padding: 20px; }
        .login-card { max-width: 400px; width: 100%; border: none; border-radius: 20px; }
        .avatar-lg { width: 100px; height: 100px; background-color: #0070ba; color: white; display: flex; align-items: center; justify-content: center; font-size: 2.5rem; border-radius: 50%; margin: 0 auto 1.5rem; }
    </style>
</head>
<body>
    <div class="card shadow-lg p-4 login-card">
        <div class="avatar-lg shadow-sm">{{ u.username|make_list|first|upper }}</div>
        <h3 class="text-center mb-1 fw-bold">Hola, {{ u.username }}</h3>
        <p class="text-center text-muted mb-4">Introduce tu contraseña</p>

        <form method="post">
            {% csrf_token %}
            <input type="hidden" name="user_id" value="{{ u.id }}">
            <div class="mb-4">
                <input type="password" name="password" class="form-control form-control-lg text-center" placeholder="Contraseña" required autofocus style="border-radius: 12px;">
            </div>
            {% if error %}
            <div class="alert alert-danger py-2 mb-4 text-center small"><i class="bi bi-exclamation-circle me-2"></i>{{ error }}</div>
            {% endif %}
            <button type="submit" class="btn btn-primary w-100 btn-lg rounded-pill py-3 fw-bold">Entrar</button>
            <div class="text-center mt-4">
                <a href="{% url 'seleccionar_perfil' %}" class="text-muted text-decoration-none small">
                    <i class="bi bi-arrow-left me-1"></i>Elegir otro perfil
                </a>
            </div>
        </form>
    </div>
</body>
</html>
