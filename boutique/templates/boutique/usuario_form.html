<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asignar Rol - Adelé</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root { --primary-color: #0070ba; }
        body { background-color: #f8f9fa; display: flex; align-items: center; justify-content: center; height: 100vh; }
        .form-card { width: 100%; max-width: 400px; padding: 2rem; border-radius: 1rem; border: none; }
        .btn-primary { background-color: var(--primary-color); border: none; border-radius: 100px; padding: 0.8rem; }
    </style>
</head>
<body>
    <div class="card form-card shadow-sm">
        <h3 class="text-center mb-4 text-primary fw-bold">Asignar Rol</h3>
        <p class="text-center">Cambiando rol para: <strong>{{ u.username }}</strong></p>

        <form method="post">
            {% csrf_token %}
            <div class="mb-4">
                <label class="form-label fw-bold">Selecciona el Grupo/Rol</label>
                <select name="grupo" class="form-select form-select-lg">
                    {% for g in grupos %}
                    <option value="{{ g.id }}" {% if g in u.groups.all %}selected{% endif %}>{{ g.name }}</option>
                    {% endfor %}
                </select>
            </div>

            <button type="submit" class="btn btn-primary w-100 fw-bold">Guardar Cambios</button>
            <a href="{% url 'gestion_usuarios' %}" class="btn btn-link w-100 mt-2 text-decoration-none text-muted">Cancelar</a>
        </form>
    </div>
</body>
</html>
