<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apertura de Caja - Adelé</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        :root { --primary-color: #0070ba; }
        body { background-color: #f8f9fa; display: flex; align-items: center; justify-content: center; height: 100vh; padding: 20px; }
        .setup-card { width: 100%; max-width: 450px; padding: 2.5rem; border-radius: 20px; border: none; }
        .btn-primary { background-color: var(--primary-color); border: none; border-radius: 100px; padding: 1rem; }
    </style>
</head>
<body>
    <div class="card setup-card shadow-lg text-center">
        <div class="mb-4">
            <i class="bi bi-unlock text-primary display-4"></i>
        </div>
        <h2 class="mb-3 fw-bold">Apertura de Caja</h2>
        <p class="text-muted mb-4">Ingresa el monto de efectivo inicial para comenzar las operaciones del día.</p>

        <form method="post">
            {% csrf_token %}
            <div class="mb-4">
                <div class="input-group input-group-lg shadow-sm" style="border-radius: 12px; overflow: hidden;">
                    <span class="input-group-text bg-white border-end-0">$</span>
                    <input type="number" step="0.01" name="monto_apertura" class="form-control border-start-0 text-center fw-bold" value="0.00" required autofocus>
                </div>
            </div>

            <div class="d-flex align-items-center justify-content-center mb-4 p-2 bg-light rounded-pill">
                <div class="bg-primary text-white rounded-circle d-flex align-items-center justify-content-center me-2" style="width: 28px; height: 28px; font-size: 0.8rem;">
                    {{ request.active_profile.username|make_list|first|upper }}
                </div>
                <small class="text-muted">Apertura por: <strong>{{ request.active_profile.username }}</strong></small>
            </div>

            <button type="submit" class="btn btn-primary w-100 fw-bold shadow-sm">Abrir Sistema de Ventas</button>
            <div class="mt-3">
                <a href="{% url 'cambiar_perfil' %}" class="btn btn-link text-muted text-decoration-none small">
                    <i class="bi bi-person-x me-1"></i>Cambiar de perfil
                </a>
            </div>
        </form>
    </div>
</body>
</html>
