<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apertura de Caja - Adelé</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root { --primary-color: #0070ba; }
        body { background-color: #f8f9fa; display: flex; align-items: center; justify-content: center; height: 100vh; }
        .setup-card { width: 100%; max-width: 400px; padding: 2rem; border-radius: 1rem; border: none; }
        .btn-primary { background-color: var(--primary-color); border: none; border-radius: 100px; padding: 0.8rem; }
    </style>
</head>
<body>
    <div class="card setup-card shadow-sm text-center">
        <h3 class="mb-4 text-primary fw-bold">Apertura de Caja</h3>
        <p class="text-muted mb-4">Ingresa el monto de efectivo inicial con el que abres la caja hoy.</p>
        <form method="post">
            {% csrf_token %}
            <div class="mb-4">
                <div class="input-group input-group-lg">
                    <span class="input-group-text">$</span>
                    <input type="number" step="0.01" name="monto_apertura" class="form-control" value="0.00" required autofocus>
                </div>
            </div>
            <button type="submit" class="btn btn-primary w-100 fw-bold">Abrir Sistema</button>
            <a href="{% url 'index' %}" class="btn btn-link mt-2 text-muted text-decoration-none">Volver</a>
        </form>
    </div>
</body>
</html>
