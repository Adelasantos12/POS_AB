<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seleccionar Perfil - Adelé</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body { background-color: #f8f9fa; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; padding: 20px; }
        .profile-card { cursor: pointer; transition: transform 0.2s, box-shadow 0.2s; border: none; border-radius: 15px; background: white; }
        .profile-card:hover { transform: translateY(-5px); box-shadow: 0 10px 20px rgba(0,0,0,0.1); }
        .avatar { width: 80px; height: 80px; background-color: #0070ba; color: white; display: flex; align-items: center; justify-content: center; font-size: 2rem; border-radius: 50%; margin: 0 auto 1rem; }
    </style>
</head>
<body>
    <div class="container text-center">
        <h1 class="mb-5 fw-bold">¿Quién está trabajando hoy?</h1>
        <div class="row justify-content-center">
            {% for u in usuarios %}
            <div class="col-6 col-sm-4 col-md-3 col-lg-2 mb-4">
                <a href="{% url 'autenticar_perfil' %}?user_id={{ u.id }}" class="text-decoration-none text-dark">
                    <div class="card p-4 profile-card shadow-sm h-100">
                        <div class="avatar">{{ u.username|make_list|first|upper }}</div>
                        <h5 class="mb-1 text-truncate">{{ u.username }}</h5>
                        <small class="text-muted d-block">{{ u.groups.all.0.name|default:"Vendedor" }}</small>
                    </div>
                </a>
            </div>
            {% endfor %}
        </div>
        <div class="mt-5">
            <a href="{% url 'logout' %}" class="btn btn-link text-muted text-decoration-none">
                <i class="bi bi-box-arrow-right me-1"></i>Cerrar sesión de terminal
            </a>
        </div>
    </div>
</body>
</html>
