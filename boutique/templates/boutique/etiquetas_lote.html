<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Imprimir Etiquetas - Adelé</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: Arial, sans-serif;
            background: #eee;
        }

        /*
         * Etiqueta: cinta continua 62 mm × 20 mm de largo
         * Layout Opción A:
         *  ┌──────────────────────────────────────────────┐
         *  │ ████████ barcode ████████   $1,200           │
         *  │                             T: M             │
         *  │  SKU-0042                                    │
         *  └──────────────────────────────────────────────┘
         */
        .etiqueta {
            background: white;
            width: 62mm;
            height: 20mm;
            padding: 0.5mm 0.8mm;
            margin: 10px auto;
            border: 1px dashed #bbb;
            display: flex;
            flex-direction: row;
            gap: 1.2mm;
            overflow: hidden;
            page-break-after: always;
        }

        /* ── Zona izquierda: barcode + SKU ── */
        .left-zone {
            flex: 0 0 60%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow: hidden;
        }

        .barcode-wrap {
            flex: 1;
            display: flex;
            align-items: flex-start;
            overflow: hidden;
        }

        .barcode-wrap img {
            height: 11mm;
            width: auto;
            max-width: 100%;
            object-fit: contain;
            object-position: left center;
            display: block;
        }

        .no-barcode {
            display: flex;
            align-items: center;
            width: 100%;
            height: 11mm;
            font-size: 12pt;
            font-weight: bold;
            letter-spacing: 1px;
            color: #222;
        }

        .sku-text {
            font-size: 4.5pt;
            color: #666;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            line-height: 1;
            padding-top: 0.2mm;
        }

        /* ── Zona derecha: precio + talla + color ── */
        .right-zone {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            overflow: hidden;
        }

        .precio {
            font-size: 9.5pt;
            font-weight: bold;
            white-space: nowrap;
            line-height: 1.1;
        }

        .talla {
            font-size: 6pt;
            color: #444;
            white-space: nowrap;
            line-height: 1.2;
            margin-top: 0.4mm;
        }

        .color-tag {
            font-size: 5.5pt;
            color: #000;
            font-weight: bold;
            white-space: nowrap;
            line-height: 1.2;
            margin-top: 0.3mm;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        /* ── Print ── */
        @page {
            size: 62mm 20mm;
            margin: 0;
        }
        @media print {
            body { background: white; }
            .etiqueta {
                margin: 0;
                border: none;
            }
            .no-print { display: none !important; }
            .qty-controls { display: none !important; }
        }

        /* ── Header / controles ── */
        .no-print {
            background: #1e293b;
            color: white;
            padding: 12px 16px;
            text-align: center;
            font-size: 13px;
        }
        .no-print button {
            margin-left: 12px;
            background: #2563EB;
            color: white;
            border: none;
            padding: 6px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
        }
        .no-print small {
            display: block;
            margin-top: 4px;
            color: #94a3b8;
            font-size: 11px;
        }

        /* ── Selector de cantidad (solo en pantalla) ── */
        .qty-controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            background: #f0f4ff;
            border: 1px dashed #94a3b8;
            border-top: none;
            padding: 4px 8px;
            font-size: 11px;
            color: #334155;
            width: 62mm;
            margin: 0 auto;
        }
        .qty-controls input {
            width: 42px;
            text-align: center;
            border: 1px solid #cbd5e1;
            border-radius: 4px;
            padding: 2px 4px;
            font-size: 12px;
        }
        .qty-controls label { margin: 0; }
    </style>
</head>
<body>
    <div class="no-print">
        Etiqueta <strong>62 mm × 20 mm</strong> (cinta continua DK-22243) · Márgenes en 0.
        <button onclick="imprimirConCantidades()">🖨️ Imprimir</button>
        <small>Ajusta las cantidades de cada modelo antes de imprimir · Brother QL-800</small>
    </div>

    {% for p in productos %}
    <!-- Selector de cantidad (solo visible en pantalla) -->
    <div class="qty-controls" id="ctrl-{{ p.pk }}">
        <label>{{ p.sku }}{% if p.color %} · {{ p.color.nombre }}{% endif %}{% if p.talla %} · T:{{ p.talla }}{% endif %}</label>
        <input type="number" min="1" max="50" value="1" id="qty-{{ p.pk }}" title="Cantidad de etiquetas">
        <span>copias</span>
    </div>

    <!-- Etiqueta real (se duplica via JS según cantidad) -->
    <template id="tpl-{{ p.pk }}">
    <div class="etiqueta">
        <!-- Zona izquierda: barcode + SKU -->
        <div class="left-zone">
            <div class="barcode-wrap">
                {% if p.barcode_image %}
                    <img src="{{ p.barcode_image.url }}" alt="{{ p.sku }}">
                {% else %}
                    <div class="no-barcode">{{ p.sku }}</div>
                {% endif %}
            </div>
            {% if p.barcode_image %}
            <div class="sku-text">{{ p.sku }}</div>
            {% endif %}
        </div>

        <!-- Zona derecha: precio + talla + color -->
        <div class="right-zone">
            <div class="precio">${{ p.precio_venta|floatformat:0 }}</div>
            {% if p.talla %}<div class="talla">T: {{ p.talla }}</div>{% endif %}
            {% if p.color %}<div class="color-tag">{{ p.color.nombre }}</div>{% endif %}
        </div>
    </div>
    </template>
    {% endfor %}

    <!-- Contenedor donde se inyectan las etiquetas reales -->
    <div id="etiquetas-container"></div>

    <script>
    const PRODUCTO_IDS = [{% for p in productos %}{{ p.pk }},{% endfor %}];

    function renderizarPreview() {
        const container = document.getElementById('etiquetas-container');
        container.innerHTML = '';
        PRODUCTO_IDS.forEach(pid => {
            const qty = parseInt(document.getElementById(`qty-${pid}`)?.value || 1, 10);
            const tpl = document.getElementById(`tpl-${pid}`);
            if (!tpl) return;
            for (let i = 0; i < qty; i++) {
                container.appendChild(tpl.content.cloneNode(true));
            }
        });
    }

    function imprimirConCantidades() {
        renderizarPreview();
        window.print();
    }

    window.addEventListener('DOMContentLoaded', () => {
        renderizarPreview();
        PRODUCTO_IDS.forEach(pid => {
            const input = document.getElementById(`qty-${pid}`);
            if (input) input.addEventListener('change', renderizarPreview);
        });
    });
    </script>
</body>
</html>
