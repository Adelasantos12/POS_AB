<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Imprimir Etiquetas - Adelé</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: Arial, sans-serif;
            background: #eee;
        }

        /* ── Label (screen) ── */
        .etiqueta {
            background: white;
            width: 90mm;
            height: 29mm;
            padding: 1.5mm 1mm;
            margin: 10px auto;
            border: 1px dashed #bbb;
            display: flex;
            flex-direction: row;
            align-items: stretch;
            overflow: hidden;
            -webkit-print-color-adjust: exact;
            print-color-adjust: exact;
        }

        .col-info {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            width: 22mm;
            min-width: 22mm;
            padding-left: 1mm;
            padding-right: 1mm;
            border-right: 1px solid #ddd;
            text-align: center;
        }

        .precio {
            font-size: 11pt;
            font-weight: bold;
            line-height: 1.1;
            white-space: nowrap;
        }

        .talla-color {
            font-size: 7pt;
            color: #333;
            line-height: 1.4;
            margin-top: 1mm;
            text-align: center;
        }

        .col-barcode {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 0 3mm;
            overflow: hidden;
        }

        /* Screen: allow SVG to scale down if label preview is small */
        .col-barcode svg {
            display: block;
            max-width: 100%;
            height: auto;
        }

        /* Fallback for products without barcode */
        .no-barcode {
            font-size: 8pt;
            font-weight: bold;
            letter-spacing: 1px;
            color: #222;
            text-align: center;
        }

        .sku-text {
            font-size: 6pt;
            color: #222;
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            width: 100%;
            margin-top: 1mm;
            letter-spacing: 0.3px;
        }

        /* ── Print ── */
        @page { size: 90mm 29mm; margin: 0; }

        @media print {
            /* Let the document grow to fit N labels; never clip it */
            html, body {
                margin: 0;
                padding: 0;
                width: 90mm;
                height: auto;
                overflow: visible;
                background: white;
            }

            /* Hide every non-label element with display:none */
            .no-print,
            .qty-controls,
            template,
            script { display: none !important; }

            #etiquetas-container { display: block; }

            .etiqueta {
                width: 90mm;
                height: 28mm;          /* 28 mm fits inside the QL-800 printable area */
                box-sizing: border-box;
                display: flex;
                flex-direction: row;
                align-items: stretch;
                overflow: hidden;
                margin: 0;
                padding: 1.5mm 1mm;
                border: none;
                outline: none;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
                /* No break-after — page break is forced BEFORE each subsequent label */
            }

            /* Page break before every label except the first */
            .etiqueta + .etiqueta {
                break-before: page;
                page-break-before: always;
            }

            /* Barcode: render at native mm size — no CSS scaling */
            .col-barcode svg {
                max-width: none;
                max-height: none;
                width: auto;
                height: auto;
            }
        }

        /* ── Header ── */
        .no-print {
            background: #1e293b;
            color: white;
            padding: 12px 16px;
            text-align: center;
            font-size: 13px;
        }
        .no-print button {
            margin-left: 12px;
            background: #2563EB;
            color: white;
            border: none;
            padding: 6px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
        }
        .no-print small {
            display: block;
            margin-top: 4px;
            color: #94a3b8;
            font-size: 11px;
        }

        /* ── Qty controls ── */
        .qty-controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            background: #f0f4ff;
            border: 1px dashed #94a3b8;
            border-top: none;
            padding: 4px 8px;
            font-size: 11px;
            color: #334155;
            width: 90mm;
            margin: 0 auto;
        }
        .qty-controls input {
            width: 42px;
            text-align: center;
            border: 1px solid #cbd5e1;
            border-radius: 4px;
            padding: 2px 4px;
            font-size: 12px;
        }
        .qty-controls label { margin: 0; }
    </style>
</head>
<body>
    <div class="no-print">
        Etiqueta <strong>29 mm × 90 mm</strong> (DK-11210) — diseño horizontal
        <button onclick="imprimir()">🖨️ Imprimir</button>
        <small>
            <strong>Brother QL-800:</strong>
            Impresora → <strong>Brother QL-800</strong> &nbsp;·&nbsp;
            Papel → <strong>Etiqueta de dirección estándar 29×90 mm</strong> &nbsp;·&nbsp;
            Orientación → <strong>Horizontal</strong> &nbsp;·&nbsp;
            Escala → <strong>100%</strong>
        </small>
    </div>

    {% for p in productos %}
    <div class="qty-controls" id="ctrl-{{ p.pk }}">
        <label>{{ p.sku }}{% if p.color %} · {{ p.color.nombre }}{% endif %}{% if p.talla %} · T:{{ p.talla }}{% endif %}</label>
        <input type="number" min="1" max="50" value="1" id="qty-{{ p.pk }}" title="Cantidad de etiquetas">
        <span>copias</span>
    </div>

    <template id="tpl-{{ p.pk }}">
    <div class="etiqueta">
        <div class="col-info">
            <div class="precio">${{ p.precio_venta|floatformat:0 }}</div>
            <div class="talla-color">
                {% if p.talla %}T: {{ p.talla }}{% endif %}
                {% if p.color %}<br>{{ p.color.nombre|upper }}{% endif %}
            </div>
        </div>
        <div class="col-barcode">
            {% if p.barcode_svg %}
                {{ p.barcode_svg|safe }}
            {% elif p.barcode_image %}
                <img src="{{ p.barcode_image.url }}" alt="{{ p.sku }}" style="max-width:100%;max-height:18mm;display:block;">
            {% else %}
                <div class="no-barcode">{{ p.sku }}</div>
            {% endif %}
            <div class="sku-text">{{ p.sku }}</div>
        </div>
    </div>
    </template>
    {% endfor %}

    <div id="etiquetas-container"></div>

    <script>
    var PRODUCTO_IDS = [{% for p in productos %}{{ p.pk }},{% endfor %}];

    function renderizarPreview() {
        var container = document.getElementById('etiquetas-container');
        container.innerHTML = '';
        PRODUCTO_IDS.forEach(function(pid) {
            var qty = parseInt(document.getElementById('qty-' + pid).value || 1, 10);
            var tpl = document.getElementById('tpl-' + pid);
            if (!tpl) return;
            for (var i = 0; i < qty; i++) {
                container.appendChild(tpl.content.cloneNode(true));
            }
        });
    }

    function imprimir() {
        window.print();
    }

    window.addEventListener('DOMContentLoaded', function() {
        renderizarPreview();
        PRODUCTO_IDS.forEach(function(pid) {
            var input = document.getElementById('qty-' + pid);
            if (input) input.addEventListener('change', renderizarPreview);
        });
    });
    </script>
</body>
</html>
