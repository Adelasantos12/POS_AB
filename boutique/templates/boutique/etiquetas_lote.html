<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Imprimir Etiquetas - Adelé</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: Arial, sans-serif;
            background: #eee;
        }

        /*
         * DK-11210  29 mm × 90 mm — diseño HORIZONTAL (landscape)
         * La cinta mide 29 mm de ancho; la etiqueta ya troquelada 90 mm de largo.
         * En horizontal la dimensión larga (90 mm) queda como ancho → código de barras amplio.
         *
         * Layout (izquierda → derecha):
         *  ┌──────────┬─────────────────────────────────┐
         *  │ $1,200   │  ▌▌▌▌▌▌▌▌▌▌▌▌▌▌▌▌▌▌▌▌▌▌▌▌▌▌▌▌ │
         *  │ T: M     │           SKU-0042              │
         *  │ AZUL     │                                 │
         *  └──────────┴─────────────────────────────────┘
         */

        .etiqueta {
            background: white;
            width: 90mm;
            height: 29mm;
            padding: 1.5mm 1mm;
            margin: 10px auto;
            border: 1px dashed #bbb;
            display: flex;
            flex-direction: row;
            align-items: stretch;
            overflow: hidden;
            page-break-after: always;
        }

        .col-info {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: flex-start;
            width: 22mm;
            min-width: 22mm;
            padding-right: 1mm;
            border-right: 1px solid #ddd;
        }

        .precio {
            font-size: 9pt;
            font-weight: bold;
            line-height: 1.1;
            white-space: nowrap;
        }

        .talla-color {
            font-size: 5.5pt;
            color: #333;
            line-height: 1.4;
            margin-top: 1mm;
        }

        .col-barcode {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 0 1mm;
            overflow: hidden;
        }

        .col-barcode img {
            max-width: 100%;
            max-height: 18mm;
            object-fit: contain;
            display: block;
        }

        .no-barcode {
            font-size: 8pt;
            font-weight: bold;
            letter-spacing: 1px;
            color: #222;
            text-align: center;
        }

        .sku-text {
            font-size: 4.5pt;
            color: #555;
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            width: 100%;
            margin-top: 1mm;
        }

        /* ── Print ── */
        /*
         * NO se define size: en @page — conflictuaría con el driver Brother en macOS.
         * El driver ya controla el tamaño cuando el usuario selecciona DK-11210.
         */
        @page { margin: 0; }

        @media print {
            body { background: white; }
            .etiqueta {
                width: 90mm;
                height: 29mm;
                margin: 0;
                border: none;
                padding: 1mm;
            }
            .no-print { display: none !important; }
            .qty-controls { display: none !important; }
        }

        /* ── Header ── */
        .no-print {
            background: #1e293b;
            color: white;
            padding: 12px 16px;
            text-align: center;
            font-size: 13px;
        }
        .no-print button {
            margin-left: 12px;
            background: #2563EB;
            color: white;
            border: none;
            padding: 6px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
        }
        .no-print small {
            display: block;
            margin-top: 4px;
            color: #94a3b8;
            font-size: 11px;
        }

        /* ── Selector de cantidad ── */
        .qty-controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            background: #f0f4ff;
            border: 1px dashed #94a3b8;
            border-top: none;
            padding: 4px 8px;
            font-size: 11px;
            color: #334155;
            width: 90mm;
            margin: 0 auto;
        }
        .qty-controls input {
            width: 42px;
            text-align: center;
            border: 1px solid #cbd5e1;
            border-radius: 4px;
            padding: 2px 4px;
            font-size: 12px;
        }
        .qty-controls label { margin: 0; }
    </style>
</head>
<body>
    <div class="no-print">
        Etiqueta <strong>29 mm × 90 mm</strong> (DK-11210) — diseño horizontal
        <button onclick="imprimirConCantidades()">🖨️ Imprimir</button>
        <small>En el diálogo: Brother QL-800 · Papel = DK-11210 (29×90 mm) · Orientación = Horizontal · Márgenes = 0 · Escala = 100%</small>
    </div>

    {% for p in productos %}
    <div class="qty-controls" id="ctrl-{{ p.pk }}">
        <label>{{ p.sku }}{% if p.color %} · {{ p.color.nombre }}{% endif %}{% if p.talla %} · T:{{ p.talla }}{% endif %}</label>
        <input type="number" min="1" max="50" value="1" id="qty-{{ p.pk }}" title="Cantidad de etiquetas">
        <span>copias</span>
    </div>

    <template id="tpl-{{ p.pk }}">
    <div class="etiqueta">
        <div class="col-info">
            <div class="precio">${{ p.precio_venta|floatformat:0 }}</div>
            <div class="talla-color">
                {% if p.talla %}T: {{ p.talla }}{% endif %}
                {% if p.color %}<br>{{ p.color.nombre|upper }}{% endif %}
            </div>
        </div>
        <div class="col-barcode">
            {% if p.barcode_image %}
                <img src="{{ p.barcode_image.url }}" alt="{{ p.sku }}">
            {% else %}
                <div class="no-barcode">{{ p.sku }}</div>
            {% endif %}
            <div class="sku-text">{{ p.sku }}</div>
        </div>
    </div>
    </template>
    {% endfor %}

    <div id="etiquetas-container"></div>

    <script>
    const PRODUCTO_IDS = [{% for p in productos %}{{ p.pk }},{% endfor %}];

    function renderizarPreview() {
        const container = document.getElementById('etiquetas-container');
        container.innerHTML = '';
        PRODUCTO_IDS.forEach(pid => {
            const qty = parseInt(document.getElementById(`qty-${pid}`)?.value || 1, 10);
            const tpl = document.getElementById(`tpl-${pid}`);
            if (!tpl) return;
            for (let i = 0; i < qty; i++) {
                container.appendChild(tpl.content.cloneNode(true));
            }
        });
    }

    function imprimirConCantidades() {
        renderizarPreview();
        window.print();
    }

    window.addEventListener('DOMContentLoaded', () => {
        renderizarPreview();
        PRODUCTO_IDS.forEach(pid => {
            const input = document.getElementById(`qty-${pid}`);
            if (input) input.addEventListener('change', renderizarPreview);
        });
    });
    </script>
</body>
</html>
