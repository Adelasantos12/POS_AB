<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Imprimir Etiquetas - Adelé</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: Arial, sans-serif;
            background: #eee;
        }

        /*
         * Etiqueta: DK-11210 troquelada 29 mm × 90 mm (portrait)
         *
         * Layout (de arriba hacia abajo):
         *  ┌────────────────────────┐
         *  │       $1,200           │  precio
         *  │     T: M  AZUL         │  talla + color
         *  │                        │
         *  │  ▌▌▌▌▌▌▌▌▌▌▌▌▌▌▌▌▌▌  │  código de barras
         *  │                        │
         *  │       SKU-0042         │  SKU
         *  └────────────────────────┘
         */
        .etiqueta {
            background: white;
            width: 29mm;
            height: 90mm;
            padding: 2mm 1.5mm;
            margin: 10px auto;
            border: 1px dashed #bbb;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            overflow: hidden;
            page-break-after: always;
        }

        .precio {
            font-size: 11pt;
            font-weight: bold;
            text-align: center;
            line-height: 1.1;
            white-space: nowrap;
        }

        .talla-color {
            font-size: 6.5pt;
            color: #333;
            text-align: center;
            white-space: nowrap;
            line-height: 1.3;
        }

        .barcode-wrap {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 1.5mm 0;
            overflow: hidden;
        }

        .barcode-wrap img {
            max-width: 100%;
            max-height: 34mm;
            object-fit: contain;
            display: block;
        }

        .no-barcode {
            font-size: 9pt;
            font-weight: bold;
            letter-spacing: 1px;
            color: #222;
            text-align: center;
        }

        .sku-text {
            font-size: 5.5pt;
            color: #555;
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            width: 100%;
        }

        /* ── Print ── */
        @page {
            size: 29mm 90mm;
            margin: 0;
        }
        @media print {
            body { background: white; }
            .etiqueta {
                margin: 0;
                border: none;
            }
            .no-print { display: none !important; }
            .qty-controls { display: none !important; }
        }

        /* ── Header / controles ── */
        .no-print {
            background: #1e293b;
            color: white;
            padding: 12px 16px;
            text-align: center;
            font-size: 13px;
        }
        .no-print button {
            margin-left: 12px;
            background: #2563EB;
            color: white;
            border: none;
            padding: 6px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
        }
        .no-print small {
            display: block;
            margin-top: 4px;
            color: #94a3b8;
            font-size: 11px;
        }

        /* ── Selector de cantidad (solo en pantalla) ── */
        .qty-controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            background: #f0f4ff;
            border: 1px dashed #94a3b8;
            border-top: none;
            padding: 4px 8px;
            font-size: 11px;
            color: #334155;
            width: 29mm;
            margin: 0 auto;
        }
        .qty-controls input {
            width: 42px;
            text-align: center;
            border: 1px solid #cbd5e1;
            border-radius: 4px;
            padding: 2px 4px;
            font-size: 12px;
        }
        .qty-controls label { margin: 0; }
    </style>
</head>
<body>
    <div class="no-print">
        Etiqueta <strong>29 mm × 90 mm</strong> (DK-11210 troquelada) · Márgenes en 0 al imprimir.
        <button onclick="imprimirConCantidades()">🖨️ Imprimir</button>
        <small>Al imprimir: selecciona Brother QL-800 · Tamaño DK-11210 (29×90 mm) · Sin márgenes</small>
    </div>

    {% for p in productos %}
    <div class="qty-controls" id="ctrl-{{ p.pk }}">
        <label>{{ p.sku }}{% if p.color %} · {{ p.color.nombre }}{% endif %}{% if p.talla %} · T:{{ p.talla }}{% endif %}</label>
        <input type="number" min="1" max="50" value="1" id="qty-{{ p.pk }}" title="Cantidad de etiquetas">
        <span>copias</span>
    </div>

    <template id="tpl-{{ p.pk }}">
    <div class="etiqueta">
        <div class="precio">${{ p.precio_venta|floatformat:0 }}</div>

        <div class="talla-color">
            {% if p.talla %}T: {{ p.talla }}{% endif %}{% if p.talla and p.color %}  {% endif %}{% if p.color %}{{ p.color.nombre|upper }}{% endif %}
        </div>

        <div class="barcode-wrap">
            {% if p.barcode_image %}
                <img src="{{ p.barcode_image.url }}" alt="{{ p.sku }}">
            {% else %}
                <div class="no-barcode">{{ p.sku }}</div>
            {% endif %}
        </div>

        <div class="sku-text">{{ p.sku }}</div>
    </div>
    </template>
    {% endfor %}

    <div id="etiquetas-container"></div>

    <script>
    const PRODUCTO_IDS = [{% for p in productos %}{{ p.pk }},{% endfor %}];

    function renderizarPreview() {
        const container = document.getElementById('etiquetas-container');
        container.innerHTML = '';
        PRODUCTO_IDS.forEach(pid => {
            const qty = parseInt(document.getElementById(`qty-${pid}`)?.value || 1, 10);
            const tpl = document.getElementById(`tpl-${pid}`);
            if (!tpl) return;
            for (let i = 0; i < qty; i++) {
                container.appendChild(tpl.content.cloneNode(true));
            }
        });
    }

    function imprimirConCantidades() {
        renderizarPreview();
        window.print();
    }

    window.addEventListener('DOMContentLoaded', () => {
        renderizarPreview();
        PRODUCTO_IDS.forEach(pid => {
            const input = document.getElementById(`qty-${pid}`);
            if (input) input.addEventListener('change', renderizarPreview);
        });
    });
    </script>
</body>
</html>
