<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adelé Boutique POS</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --primary-color: #0070ba; /* PayPal Blue */
            --secondary-color: #ffffff;
            --text-color: #242729;
            --bg-color: #ffffff;
        }
        body {
            font-family: "Salesforce Sans", "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            height: 100vh;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .hero-section {
            text-align: center;
            max-width: 400px;
            width: 90%;
        }
        .logo {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 1rem;
            color: var(--primary-color);
            letter-spacing: -1px;
        }
        .tagline {
            font-size: 1.1rem;
            color: #6c757d;
            margin-bottom: 3rem;
        }
        .btn-container {
            display: grid;
            gap: 1rem;
            width: 100%;
        }
        .btn {
            padding: 0.8rem 2rem;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 100px; /* Rounded pill style like modern fintech */
            transition: all 0.2s ease-in-out;
        }
        .btn-primary {
            background-color: var(--primary-color);
            border-color: var(--primary-color);
        }
        .btn-primary:hover {
            background-color: #005ea6;
            border-color: #005ea6;
        }
        .btn-outline-primary {
            color: var(--primary-color);
            border-color: var(--primary-color);
        }
        .btn-outline-primary:hover {
            background-color: #f0f7fd;
            color: var(--primary-color);
            border-color: var(--primary-color);
        }
        .footer-links {
            margin-top: 4rem;
            font-size: 0.85rem;
        }
        .footer-links a {
            color: #6c757d;
            text-decoration: none;
            margin: 0 10px;
        }
        .footer-links a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="hero-section">
        <div class="logo">Adelé</div>
        <p class="tagline">Punto de venta simple, para tu boutique.</p>

        <div class="btn-container">
            <a href="/admin/login/" class="btn btn-primary">Entrar</a>
            <a href="{% url 'signup' %}" class="btn btn-outline-primary">Crear cuenta</a>
        </div>
    </div>

    <div class="footer-links">
        <a href="#">Ayuda</a>
        <a href="#">Privacidad</a>
        <a href="#">Términos</a>
    </div>

</body>
</html>
