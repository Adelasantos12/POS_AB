<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Adelé Boutique POS</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body {
            background-color: #f4f5f7;
            color: #172b4d;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card {
            width: 100%;
            max-width: 450px;
            border: none;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .btn-primary {
            background-color: #0052cc;
            border-color: #0052cc;
        }
        .btn-primary:hover {
            background-color: #007bff;
            border-color: #007bff;
        }
        .form-text {
            font-size: 0.8rem;
        }
    </style>
</head>
<body>
    <div class="card p-4">
        <h1 class="h3 mb-4 text-center">Crear nueva cuenta</h1>
        <form method="post">
            {% csrf_token %}

            {% for field in form %}
                <div class="mb-3">
                    <label for="{{ field.id_for_label }}" class="form-label">{{ field.label }}</label>

                    {% if "password" in field.name %}
                        <div class="input-group">
                            <input type="password" name="{{ field.html_name }}" class="form-control" id="{{ field.id_for_label }}" required>
                            <button class="btn btn-outline-secondary toggle-password" type="button">
                                <i class="bi bi-eye"></i>
                            </button>
                        </div>
                    {% else %}
                        {{ field.errors }}
                        <input type="{{ field.field.widget.input_type|default:'text' }}" name="{{ field.html_name }}" class="form-control" id="{{ field.id_for_label }}" value="{{ field.value|default:'' }}" required>
                    {% endif %}

                    {% if field.help_text %}
                        <div class="form-text">{{ field.help_text|safe }}</div>
                    {% endif %}
                </div>
            {% endfor %}

            <button type="submit" class="btn btn-primary w-100 py-2 mt-3">Registrarse</button>
        </form>

        <div class="text-center mt-4 small">
            <p class="mb-1">¿Ya tienes una cuenta? <a href="/admin/login/" class="text-decoration-none">Inicia sesión</a></p>
            <p><a href="{% url 'index' %}" class="text-decoration-none">Volver al inicio</a></p>
        </div>
    </div>

    <!-- JavaScript para alternar visibilidad de contraseña -->
    <script>
        document.querySelectorAll('.toggle-password').forEach(button => {
            button.addEventListener('click', function() {
                const input = this.previousElementSibling;
                const icon = this.querySelector('i');

                if (input.type === 'password') {
                    input.type = 'text';
                    icon.classList.remove('bi-eye');
                    icon.classList.add('bi-eye-slash');
                } else {
                    input.type = 'password';
                    icon.classList.remove('bi-eye-slash');
                    icon.classList.add('bi-eye');
                }
            });
        });
    </script>
</body>
</html>
