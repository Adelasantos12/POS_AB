<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar - ByEasy POS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root { --primary-color: #0070ba; }
        body { background-color: #f8f9fa; display: flex; align-items: center; justify-content: center; height: 100vh; }
        .login-card { width: 100%; max-width: 400px; padding: 2rem; border-radius: 1rem; border: none; }
        .btn-primary { background-color: var(--primary-color); border: none; border-radius: 100px; padding: 0.8rem; }
    </style>
</head>
<body>
    <div class="card login-card shadow-sm">
        <h3 class="text-center mb-4 text-primary fw-bold">Adelé</h3>
        <form method="post">
            {% csrf_token %}
            {% if form.errors %}
                <div class="alert alert-danger">Usuario o contraseña incorrectos.</div>
            {% endif %}
            <div class="mb-3">
                <label class="form-label">Usuario</label>
                <input type="text" name="username" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Contraseña</label>
                <input type="password" name="password" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-primary w-100 fw-bold">Entrar</button>
            <div class="text-center mt-3">
                <a href="{% url 'signup' %}" class="text-muted text-decoration-none small">¿No tienes cuenta? Regístrate</a>
            </div>
        </form>
    </div>
</body>
</html>
